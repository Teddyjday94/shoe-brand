<!doctype html>
<html><head><meta charset="utf-8"><title>foot video test</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head><body style="margin:0;background:#111;color:#ddd;font:12px monospace"><pre id="log"></pre>
<script type="module">
// Runs the live tracker + renderer offline, frame by frame, and saves composited frames.
//   videotest.html?video=ml/data/test/clip.mp4&fps=15&out=clip
//   videotest.html?images=ml/data/test/a.jpg,ml/data/test/b.jpg&out=photos
// Frames land in ml/data/vidout/<out>/ (encode with ffmpeg). ?s=hi1&c=0 picks the shoe.
import { createDetector, intrinsics, FeetTracker } from '../js/foottrack.js';
import { FootScene } from '../js/footscene.js';
import { shoeById } from '../js/data.js';
const q = new URLSearchParams(location.search);
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const OUT = q.get('out') || 'run', FPS = +q.get('fps') || 15, MAXW = +q.get('maxw') || 720;
const shoe = shoeById(q.get('s')), cw = shoe.colorways[+(q.get('c') || 0)];
const COLORS = ['#ff2a2a', '#2a7bff', '#ffd400', '#00e0a0', '#ff00ff', '#00ffff', '#ff8800', '#ffffff'];

const detector = await createDetector({ modelUrl: new URL('../assets/ml/foot.onnx', location.href).href, prefer: (q.get('ep') || 'webgpu,wasm').split(',') });
log('backend ' + detector.backend);
const frame = document.createElement('canvas'), fg = frame.getContext('2d');
const view = document.createElement('canvas');
const scene = new FootScene(view, { preserve: true });
await scene.setProduct(shoe.id, cw.key);
scene.setSource(frame);
const out = document.createElement('canvas'), og = out.getContext('2d');
const save = (name, blob) => fetch(`/save?path=vidout/${OUT}/${name}`, { method: 'POST', body: blob });

async function processFrame(src, sw, sh, tracker, tMs, name) {
  const k = Math.min(1, MAXW / sw), w = Math.round(sw * k), h = Math.round(sh * k);
  // a resized canvas needs a fresh texture, or the background keeps the previous image
  if (frame.width !== w || frame.height !== h) { frame.width = w; frame.height = h; scene.setSource(frame); }
  fg.drawImage(src, 0, 0, w, h);
  const K = intrinsics(w, h, +(q.get('fov') || 64));
  scene.resize(K);
  scene.bg.needsUpdate = true;
  const det = await detector.detect(frame, w, h);
  const tracks = tracker.update(det.feet, K, tMs);
  // let the fade settle on stills; one step per frame on video
  for (let i = 0; i < (q.has('images') ? 20 : 1); i++) scene.update(tracks, det.brightness, 1 / FPS);
  scene.render();
  // side by side: left = detections on the raw frame, right = shoes rendered on
  out.width = w * 2; out.height = h;
  og.drawImage(frame, 0, 0);
  for (const f of det.feet) {
    og.strokeStyle = '#0f0'; og.lineWidth = 2; og.strokeRect(f.box[0], f.box[1], f.box[2] - f.box[0], f.box[3] - f.box[1]);
    og.fillStyle = '#0f0'; og.font = '14px monospace'; og.fillText(f.score.toFixed(2), f.box[0] + 3, f.box[1] + 15);
    f.kps.forEach(([x, y, c], i) => { if (c < 0.35) return; og.fillStyle = COLORS[i]; og.beginPath(); og.arc(x, y, 5, 0, 7); og.fill(); });
  }
  og.drawImage(view, w, 0);
  og.fillStyle = 'rgba(0,0,0,.6)'; og.fillRect(w, 0, w, 22);
  og.fillStyle = '#fff'; og.font = '13px monospace';
  og.fillText(`${shoe.name} ${cw.name} | ${det.ms.toFixed(0)}ms | ` + tracks.map((t) => `${t.pose.side} err ${t.pose.err.toFixed(1)}`).join('  '), w + 6, 15);
  await save(name, await new Promise((r) => out.toBlob(r, 'image/jpeg', 0.88)));
  return { feet: det.feet.length, tracks: tracks.length, ms: det.ms, top: det.top, errs: tracks.map((t) => +t.pose.err.toFixed(1)) };
}

if (q.has('seq')) {
  // frames pre-extracted with ffmpeg (seeking a <video> in a hidden tab hands back unpainted
  // frames): seq=ml/data/test/feet1&n=223 reads <seq>/0001.jpg … with tracking kept across frames
  const dir = q.get('seq'), n = +q.get('n');
  const tracker = new FeetTracker();
  let found = 0;
  for (let i = 0; i < n; i++) {
    const img = new Image(); img.src = `../${dir}/${String(i + 1).padStart(4, '0')}.jpg`; await img.decode();
    const r = await processFrame(img, img.naturalWidth, img.naturalHeight, tracker, (i * 1000) / FPS, `f${String(i).padStart(4, '0')}.jpg`);
    if (r.tracks) found++;
    if (i % 15 === 0 || q.has('every')) log(`frame ${i}/${n} t=${(i / FPS).toFixed(1)}s feet ${r.feet} top ${r.top.toFixed(2)} posed ${r.tracks} errs ${r.errs} ${r.ms.toFixed(0)}ms`);
  }
  log(`posed on ${found}/${n} frames`);
} else if (q.has('images')) {
  for (const [i, p] of q.get('images').split(',').entries()) {
    const img = new Image(); img.src = '../' + p; await img.decode();
    const r = await processFrame(img, img.naturalWidth, img.naturalHeight, new FeetTracker(), 0, `img${String(i).padStart(3, '0')}.jpg`);
    log(`${p}: feet ${r.feet} top ${r.top.toFixed(2)} posed ${r.tracks} errs ${r.errs} ${r.ms.toFixed(0)}ms`);
  }
} else {
  const v = document.createElement('video');
  v.src = '../' + q.get('video'); v.muted = true; v.preload = 'auto';
  await new Promise((r) => { v.onloadeddata = r; });
  const tracker = new FeetTracker(), n = Math.floor(v.duration * FPS);
  let found = 0;
  for (let i = 0; i < n; i++) {
    v.currentTime = i / FPS;
    await new Promise((r) => { v.onseeked = r; });
    const r = await processFrame(v, v.videoWidth, v.videoHeight, tracker, (i * 1000) / FPS, `f${String(i).padStart(4, '0')}.jpg`);
    if (r.tracks) found++;
    if (i % 15 === 0 || q.has('every')) log(`frame ${i}/${n} t=${(i / FPS).toFixed(1)}s feet ${r.feet} top ${r.top.toFixed(2)} posed ${r.tracks} errs ${r.errs} ${r.ms.toFixed(0)}ms`);
  }
  log(`posed on ${found}/${n} frames`);
}
log('DONE');
</script></body></html>
