<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLAB® On Your Feet (beta)</title>
<meta name="description" content="Point your phone at your feet and wear a SLAB® shoe, live in your browser. No app; the video stays on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --ink: #0d0d0d; --paper: #eae8e3; --red: #e61919; --mono: 'JetBrains Mono', monospace; --heavy: 'Archivo Black', sans-serif; }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font: 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .05em; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  #debug { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: linear-gradient(rgba(0,0,0,.55), transparent); z-index: 3; }
  .top a { color: var(--paper); text-decoration: none; font-family: var(--heavy); font-size: 20px; letter-spacing: -.03em; }
  .top samp { background: var(--red); padding: 2px 6px; font-size: 10px; }
  #stats { position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 12px; z-index: 3; font-size: 10px; background: rgba(0,0,0,.55); padding: 4px 6px; display: none; }
  #hint { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 3; text-align: center; background: rgba(13,13,13,.75); padding: 10px 14px; border: 2px solid var(--paper); transition: opacity .3s; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 10px 10px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.7)); display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 9px 4px; box-shadow: 3px 3px 0 var(--ink); }
  button[aria-pressed="true"] { background: var(--red); color: var(--paper); }
  button.ghost { background: transparent; color: var(--paper); border-color: var(--paper); box-shadow: none; }
  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  #start { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; background: var(--ink); }
  #start h1 { font: 400 52px/0.88 var(--heavy); letter-spacing: -.05em; margin: 0; }
  #start p { text-transform: none; letter-spacing: .01em; font-size: 14px; max-width: 32ch; margin: 0 auto; opacity: .8; }
  #start button { font-size: 15px; padding: 16px; background: var(--red); color: var(--paper); font-weight: 700; }
  #start output { color: var(--red); min-height: 1.3em; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="view" aria-label="Camera view with SLAB shoes on your feet"></canvas>
<canvas id="debug" aria-hidden="true"></canvas>

<div class="top"><a href="tryon.html">SLAB®</a><samp>ON YOUR FEET / BETA</samp></div>
<div id="stats"></div>
<div id="hint">POINT THE CAMERA DOWN AT YOUR FEET</div>

<div class="bottom">
  <div class="row" id="shoes" role="group" aria-label="Shoe"></div>
  <div class="row" id="colors" role="group" aria-label="Colorway"></div>
  <div class="tools">
    <button class="ghost" id="snap" type="button">[ SNAPSHOT ]</button>
    <button class="ghost" id="dbg" type="button" aria-pressed="false">[ DEBUG ]</button>
    <button class="ghost" id="flip" type="button">[ CAMERA ]</button>
  </div>
</div>

<div id="start">
  <h1>ON YOUR<br>FEET.</h1>
  <p>Point your phone down at your feet. The shoe finds them and stays on while you move. Works best in good light, feet fully in view. The video stays on your device.</p>
  <button id="go" type="button">START CAMERA &gt;&gt;&gt;</button>
  <output id="start-msg"></output>
</div>

<script type="module" src="js/feet.js"></script>
</body>
</html>
